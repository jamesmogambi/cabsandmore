# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - cabsandmore

on:
  push:
    branches:
      - 'mobile-app-store-links'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install and build
        env:
          NEXTJS_OUTPUT: standalone
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Prepare Azure deployment
        run: |
          mkdir -p azure-deploy
          cp -r .next/standalone/* azure-deploy/
          cp -r public azure-deploy/
          mkdir -p azure-deploy/.next
          cp -r .next/static azure-deploy/.next/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: azure-deploy
          path: azure-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: azure-deploy
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C4914401A2DA4A2B8EE64DEBC37B5D16 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_71EE3917296943CD8344EDE4CE7B993C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CF06D78FCBD34A46B3CFE8EBC51A7EA5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cabsandmore'
          slot-name: 'Production'
          package: ./azure-deploy
          