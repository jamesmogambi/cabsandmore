<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cabs&amp;More">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F14"/>
      <stop offset="1" stop-color="#07140F"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26C165"/>
      <stop offset="1" stop-color="#17A152"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="url(#bg)"/>

  <!-- subtle inner highlight -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- soft glow behind the mark -->
  <circle cx="256" cy="256" r="150" fill="#26C165" opacity="0.10" filter="url(#soft)"/>

  <!-- Stylized "C" / road mark -->
  <g transform="translate(256 256)">
    <!-- outer C stroke forming a road -->
    <path d="M 0 -128 A 128 128 0 1 1 -0.1 -128"
          fill="none"
          stroke="url(#road)"
          stroke-width="44"
          stroke-linecap="round"
          stroke-dasharray="16 14"/>

    <!-- lane dashes inside the C -->
    <path d="M 0 -112 A 112 112 0 1 1 -0.1 -112"
          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.85"
          stroke-width="6"
          stroke-linecap="round"
          stroke-dasharray="8 20"/>

    <!-- terminal accent dot -->
    <circle cx="0" cy="-128" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="-128" r="7" fill="#26C165"/>
  </g>
</svg>